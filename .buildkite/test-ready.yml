# Uploaded by .buildkite/pipeline.yml. `mirror_hardwares` is not a Buildkite key;
# upload_pipeline.py expands it from hardware.yml.

steps:
  # The compose plugin reuses an image only when meta-data names it. There is no
  # registry, so this step builds on the host and records the local tag. Later
  # steps on this queue must share this machine's Docker daemon.
  - label: ":docker: Build CI image"
    key: ci-image
    mirror_hardwares: l20_1
    host_only: true
    timeout_in_minutes: 30
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu" || true
      - COMPOSE_BAKE=false BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose -f docker/docker-compose.yml build --pull --build-arg PIP_INDEX_URL agentinfer-ci
      - buildkite-agent meta-data set "docker-compose-plugin-built-image-tag-agentinfer-ci-docker/docker-compose.yml" "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu"

  # GPU smoke for the AgentInfer serve flag. Not the tests/e2e suite.
  - label: "smoke: agentinfer serve"
    depends_on: ci-image
    commands:
      - AGENTINFER_E2E_MODEL=Qwen/Qwen3-0.6B pytest -sv -m "L20 and cards_1 and ready" tests/agentcache/entrypoints/test_serve_flag_e2e.py
    timeout_in_minutes: 15
    mirror_hardwares: l20_1

  # Functional E2E. l20_1 and l20_2 share one Docker daemon, so reuse ci-image.
  # DSH still runs on the l20_2 queue to reserve both GPUs.
  - group: ":card_index_dividers: e2e function"
    depends_on: ci-image
    steps:
      # One step on the 2-GPU queue: test-user, then both 2x1 profiles.
      # The case uses the Hugging Face repo id; vLLM downloads into HF_HOME
      # (/home/models). Skip useradd when test-user exists. The step stays
      # root so plan-subagent can sudo -u test-user. single stays root.
      # DSH is /usr/local/bin/dsh.
      - label: "dsh swebench"
        mirror_hardwares: l20_2
        env:
          AGENTINFER_CI_AS_ROOT: "1"
        timeout_in_minutes: 30
        commands:
          # pipeline upload expands $NAME. $$ is the literal $ the container shell needs.
          - |
            checkout_uid=$$(stat -c %u .)
            checkout_gid=$$(stat -c %g .)
            restore_checkout_owner() {
              status=$$?
              trap - EXIT
              if [ "$$checkout_uid" != 0 ]; then
                if ! chown -R "$$checkout_uid:$$checkout_gid" .; then
                  echo "ERROR: failed to restore checkout ownership" >&2
                  if [ "$$status" = 0 ]; then status=1; fi
                fi
              fi
              exit "$$status"
            }
            trap restore_checkout_owner EXIT
            if id test-user >/dev/null 2>&1; then
              echo "test-user exists, skip useradd"
            else
              useradd -m -s /bin/bash test-user
            fi
            for extra in video render; do
              if getent group "$$extra" >/dev/null 2>&1; then
                usermod -aG "$$extra" test-user
              fi
            done
            pytest -s -v -m "L20 and cards_2 and ready" tests/e2e/function/agentbench/dsh --test-config-file tests/e2e/function/agentbench/dsh/cases/qwen3_coder_dsh_2x1.json
            pytest -s -v -m "L20 and cards_2 and ready" tests/e2e/function/agentbench/dsh --test-config-file tests/e2e/function/agentbench/dsh/cases/qwen3_coder_dsh_2x1_plan_subagent.json

  - group: ":card_index_dividers: e2e accuracy"
    depends_on: ci-image
    steps:
      - label: ":docker: Build Jiuwen accuracy image"
        key: ready-accuracy-image
        mirror_hardwares: l20_2
        host_only: true
        timeout_in_minutes: 30
        commands:
          - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-ready-accuracy-gpu" || true
          - COMPOSE_BAKE=false BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose --profile accuracy -f docker/docker-compose.yml build --build-arg PIP_INDEX_URL agentinfer-accuracy-jiuwen
          - buildkite-agent meta-data set "docker-compose-plugin-built-image-tag-agentinfer-accuracy-jiuwen-docker/docker-compose.yml" "agentinfer-ci:$$BUILDKITE_BUILD_ID-ready-accuracy-gpu"

      - label: "accuracy: JiuwenSwarm AgentInfer"
        key: ready-accuracy-jiuwenswarm
        depends_on: ready-accuracy-image
        mirror_hardwares: l20_2
        timeout_in_minutes: 30
        concurrency: 1
        concurrency_group: agentinfer/nightly-accuracy-l20
        env:
          PYTEST_ADDOPTS: >-
            -o cache_dir=/tmp/pytest-cache --capture=tee-sys -m "L20 and cards_2 and ready"
            --correctness-ci --correctness-evaluation-config /opt/agentbench/evaluation.yaml
        plugins:
          - docker-compose#v4.9.0:
              config: docker/docker-compose.yml
              cli-version: 2
              run: agentinfer-accuracy-jiuwen
              skip-pull: true
              require-prebuild: true
              environment:
                - HOME=/tmp/ci-home
                - PYTEST_ADDOPTS
        artifact_paths:
          - "tests/run/acc/jiuwenswarm-*/**/*"
          - "tests/result/acc/jiuwenswarm-*/**/*"
        commands:
          - pytest -v tests/e2e/acc/test_correctness.py::test_run_with_correctness -k jiuwenswarm

  # cpu_small is another machine, so it builds the same Dockerfile itself.
  - label: ":docker: Build CI image (cpu)"
    key: ci-image-cpu
    mirror_hardwares: cpu_small
    host_only: true
    timeout_in_minutes: 30
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu" || true
      - COMPOSE_BAKE=false BUILDX_NO_DEFAULT_ATTESTATIONS=1 docker compose -f docker/docker-compose.yml build --pull --build-arg PIP_INDEX_URL agentinfer-cpu
      - buildkite-agent meta-data set "docker-compose-plugin-built-image-tag-agentinfer-cpu-docker/docker-compose.yml" "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu"

  - group: ":card_index_dividers: ut"
    depends_on: ci-image-cpu
    steps:
      - label: "ut"
        commands:
          - pytest tests -sv -m "cpu and ready"
        timeout_in_minutes: 10
        mirror_hardwares: cpu_small

  # A plain wait skips every later step when an earlier step failed, which
  # leaves this build's tagged images on the agent. Continue so cleanup still
  # runs; the build stays failed.
  - wait: ~
    continue_on_failure: true
  - label: ":broom: Cleanup GPU agent"
    mirror_hardwares: l20_1
    # Host docker prune. Do not wrap this step in the CI container.
    host_only: true
    timeout_in_minutes: 5
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-gpu" || true
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-ready-accuracy-gpu" || true
      - docker image prune -f
  - label: ":broom: Cleanup CPU agent"
    mirror_hardwares: cpu_small
    host_only: true
    timeout_in_minutes: 5
    commands:
      - docker rmi -f "agentinfer-ci:$$BUILDKITE_BUILD_ID-cpu" || true
      - docker image prune -f
