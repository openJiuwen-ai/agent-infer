[project]
name = "agentcache"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["vllm==0.22.1"]

[project.scripts]
vllm-acache = "agentcache.entrypoints.cli.main:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["agentcache"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
