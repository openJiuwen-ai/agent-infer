[build-system]
requires = ["setuptools>=68,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentinfer"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["datasets", "fastapi", "httpx", "huggingface-hub", "matplotlib", "numpy", "prometheus-client", "PyYAML", "pydantic>=2", "tqdm", "uvicorn", "websockets", "zstandard"]
description = "vLLM based inference framework for agentic workload."
readme = { file = "README.md", content-type = "text/markdown" }

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "cpu: [hardware] CPU only, no GPU or NPU",
    "L20: [hardware] NVIDIA L20 GPU",
    "A3: [hardware] Ascend A3 NPU",
    "cards_1: one accelerator card",
    "cards_2: two accelerator cards",
    "cards_16: sixteen accelerator cards",
    "ready: selected by the ready pipeline",
    "nightly: reserved for a future nightly pipeline",
]

[tool.setuptools.packages.find]
include = ["agentinfer*"]

[tool.setuptools.package-data]
agentinfer = ["agentbench/configs/*.yaml", "agentbench/data/*.jsonl", "agentbench/agents/zcode/*.cjs"]

[project.scripts]
vllm = "agentinfer.agentcache.entrypoints.cli.main:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long, handled by formatter
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["agentinfer", "tools"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
