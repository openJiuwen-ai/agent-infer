function chartSvg(){const tp=chartMetric==='throughput',a=tp?[1180,1200,1220]:[490,480,470],b=tp?[1420,1440,1460]:[392,384,376],lo=tp?1000:320,hi=tp?1600:560;const x=i=>40+i*145,y=v=>145-(v-lo)/(hi-lo)*125;const path=data=>data.map((v,i)=>(i?'L':'M')+x(i)+' '+y(v)).join(' ');return `<svg class="chart" viewBox="0 0 365 178" role="img" aria-label="${tp?'输出吞吐':'p95首Token延迟'}三次配对实验，基线与候选比较">${[0,1,2,3].map(i=>{const v=lo+(hi-lo)/3*i;return `<line class="gridline" x1="35" x2="342" y1="${y(v)}" y2="${y(v)}"/><text x="0" y="${y(v)+3}">${Math.round(v)}</text>`}).join('')}<path d="${path(a)}" fill="none" stroke="#a4b393" stroke-width="2"/><path d="${path(b)}" fill="none" stroke="#46734e" stroke-width="2.5"/>${[a,b].map((arr,k)=>arr.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${k?'#46734e':'#a4b393'}" stroke="#fffefa" stroke-width="2"><title>${k?'候选':'基线'} 配对 ${i+1}：${v} ${tp?'tok/s':'ms'}</title></circle>`).join('')).join('')}${[0,1,2].map(i=>`<text x="${x(i)-12}" y="169">pair ${i+1}</text>`).join('')}</svg>`;}
function performanceCard(){const tp=chartMetric==='throughput';return `<section class="card"><div class="card-head"><div><div class="eyebrow">PAIRED EXPERIMENT / CUDA</div><h2>改动是否带来实际收益</h2></div><select class="select" id="chart-metric" aria-label="选择效果指标"><option value="throughput" ${tp?'selected':''}>输出吞吐</option><option value="ttft" ${!tp?'selected':''}>p95 TTFT</option></select></div><div class="card-body"><div class="chart-legend"><span><i class="legend-dot" style="background:#a4b393"></i>Baseline ${esc(state.priorGood)}</span><span><i class="legend-dot" style="background:#46734e"></i>Candidate ${esc(candidateId())}</span></div><div class="chart-grid">${chartSvg()}<div class="chart-side"><div><div class="hero-num">${tp?'+20.0%':'−20.0%'}</div><p>${tp?'平均输出吞吐提升':'首 Token 尾延迟下降'}</p></div><div><div class="mini-value">${tp?'1,200 → 1,440':'480 → 384'}</div><small>${tp?'token / second':'milliseconds'}</small></div><div><div class="mini-value">48 / 50</div><small>任务通过数 · 基线与候选相同</small></div></div></div><div class="chart-note">最近完成 attempt ${state.completedAttempt} · 3 次配对 · ${state.attempt!==state.completedAttempt?"当前 attempt "+state.attempt+" 等待新证据；":""}组合效果需消融验证</div></div></section>`;}
function changesTable(){return `<section class="card"><div class="card-head"><div><div class="eyebrow">CANDIDATE CHANGESET</div><h2>改了哪里，影响哪一层</h2></div><span class="file-count"><span class="diff-plus">+94</span> / <span class="diff-minus">−27</span> · 3 files</span></div><div class="table-wrap"><table><thead><tr><th>组件 / 范围</th><th>变更</th><th>知识关联</th><th>详情</th></tr></thead><tbody>${changes.map(c=>`<tr class="click-row" data-change="${c.id}" tabindex="0" role="button" aria-label="查看 ${c.layer} 修改"><td class="layer-name">${c.layer}<small>${c.scope}</small></td><td><span class="diff-plus">+${c.plus}</span> <span class="diff-minus">−${c.minus}</span></td><td class="mono">${c.knowledge}</td><td>${icon('arrow',13)}</td></tr>`).join('')}</tbody></table></div><div class="card-footer"><span>文件路径与 patch 为示意；点击查看差异、影响范围与证据。</span><button class="text-link" data-nav="changes">比较候选 →</button></div></section>`;}
function gates(){if(state.completedAttempt!==state.attempt)return `<div class="callout amber">当前 attempt ${state.attempt} 等待新证据。图表保留 attempt ${state.completedAttempt} 的历史结果，不能用于当前候选晋升。</div><div class="gate" style="margin-top:12px"><span class="check gray">—</span><div>Ascend 未验证；未纳入当前发布范围</div></div>`;return `<div class="gate-list"><div class="gate"><span class="check">✓</span><div class="gate-text">CUDA 服务与协议<small>固定模型 / template / tool parser</small></div>${badge('通过')}</div><div class="gate"><span class="check">✓</span><div class="gate-text">任务质量不回退<small>baseline 48/50 · candidate 48/50</small></div>${badge('通过')}</div><div class="gate"><span class="check">✓</span><div class="gate-text">性能与内存约束<small>吞吐 +20% · 峰值显存 +1.3% ＜ 5%</small></div>${badge('通过')}</div><div class="gate"><span class="check ${state.gatePassed?'':'wait'}">${state.gatePassed?'✓':'·'}</span><div class="gate-text">缓存压力与回收<small>${state.gatePassed?'模拟检查完成，证据已归档':'检查尚未完成，不能晋升'}</small></div>${badge(state.gatePassed?'通过':'等待',state.gatePassed?'':'amber')}</div><div class="gate"><span class="check gray">—</span><div class="gate-text">Ascend 独立验证<small>无 NPU 结果；未纳入当前发布目标</small></div>${badge('未验证','gray')}</div></div>`;}
function overview(){return pageHeader('运行总览',`${roundId()} · 调度与缓存协同优化 · GLM-5.3-Flash`,pauseBtn()+exportBtn())+notice()+metrics()+`<div class="grid-main"><div class="stack">${cycleCard()}${performanceCard()}${changesTable()}</div><aside class="stack right-stack">${versionCard()}${knowledgeFeature()}${actorsCard()}</aside></div>`;}
function flowPage(){return pageHeader('演化流程',`${roundId()} · 从冻结基线到下一轮，所有状态由 Controller 推进`,pauseBtn()+exportBtn())+notice()+`<div class="flow-detail-grid"><div class="stack">${cycleCard()}<section class="card"><div class="card-head"><h2>反馈如何返回</h2>${badge('预算约束始终有效','gray')}</div><div class="card-body"><div class="feedback-row"><span class="route">⑩ → ①</span><div>主循环：更新知识与基线<p>观察通过的 last_good 与适用经验进入下一轮。</p></div></div><div class="feedback-row orange"><span class="route">⑦ → ③</span><div>FAIL：修改假设<p>失败证据形成反例；新假设产生新候选。</p></div></div><div class="feedback-row"><span class="route">⑦ → ⑤</span><div>INCONCLUSIVE：追加实验<p>证据不足时重跑；旧证据按 attempt 保留。</p></div></div><div class="feedback-row red"><span class="route">⑨ → ⑧ → ⑩</span><div>上线异常：回滚后归档<p>恢复失败进入 NEEDS_RECOVERY，停止新轮。</p></div></div></div></section><section class="card"><div class="card-head"><h2>事件与交接</h2><span class="mono muted" style="font-size:10px">revision ${state.revision}</span></div><div class="card-body"><ul class="event-list">${state.audit.slice(0,6).map(e=>`<li><time>${esc(e.time)}</time><div>${esc(e.reason)}<small>${esc(e.type)} · ${esc(e.actor)}</small></div></li>`).join('')}</ul></div></section></div><aside class="stack">${versionCard()}<section class="card"><div class="card-head"><h2>当前门禁</h2>${badge('CUDA target','gray')}</div><div class="card-body">${gates()}</div></section>${actorsCard()}</aside></div>`;}
function coverageCard(){return `<section class="card"><div class="card-head"><h2>分层修改覆盖</h2>${badge('CUDA 实验范围','gray')}</div><div class="table-wrap"><table><thead><tr><th>层级</th><th>本轮修改</th><th>效果 / 验证边界</th></tr></thead><tbody>${[['system','组合候选','总体吞吐 +20%，各层贡献待消融'],['semantic-router','保持冻结','模型选择未改变'],['router','会话亲和策略','trace 变化；独立收益待验证'],['scheduling','准入优先级','公平性假设待单变量试验'],['agent-cache','保留窗口策略','显存 +1.3%，与尾延迟联合约束'],['vllm','核心引擎未改','固定 CUDA 镜像；冒烟检查通过'],['vllm-ascend','未纳入目标','没有 NPU 结果，未验证'],['harness','运行配置固定','任务验收独立于进程退出']].map(([layer,change,result])=>`<tr><td><button class="text-link mono" data-kb-link="${layer}">${layer}</button></td><td>${change}</td><td>${result}</td></tr>`).join('')}</tbody></table></div></section>`;}
function changesPage(){return pageHeader('候选与效果',`${candidateId()} · 基线 ${state.priorGood} · 3 个示意文件 / +94 −27`,exportBtn()+`<button class="btn primary" data-command="promote" ${!canPromote()?'disabled':''}>${icon('shield')}批准晋升</button>`)+notice()+`<div class="grid-main"><div class="stack">${changesTable()}${coverageCard()}<section class="card"><div class="card-head"><h2>影响链与知识关联</h2>${badge('组合修改','amber')}</div><div class="card-body"><p class="muted" style="font-size:11px">当前结果说明组合候选有效。若要把收益归因到某个组件，需要固定其他变量，补充消融实验。</p></div><div class="dependency-strip"><span>semantic-router</span>→<span class="highlight">router</span>→<span class="highlight">scheduling</span>→<span class="highlight">agent-cache</span>→<span>vLLM</span></div></section>${performanceCard()}<section class="card"><div class="card-head"><h2>同一证据包的指标对比</h2><button class="text-link" data-evidence="DEMO-E024-CUDA">查看证据 →</button></div><div class="table-wrap"><table><thead><tr><th>指标</th><th>Baseline</th><th>Candidate</th><th>变化</th></tr></thead><tbody><tr><td>输出吞吐</td><td>1,200 tok/s</td><td>1,440 tok/s</td><td class="green mono">+20.0%</td></tr><tr><td>p95 TTFT</td><td>480 ms</td><td>384 ms</td><td class="green mono">−20.0%</td></tr><tr><td>p95 端到端耗时</td><td>18.0 s</td><td>15.3 s</td><td class="green mono">−15.0%</td></tr><tr><td>任务通过率</td><td>48/50 · 96%</td><td>48/50 · 96%</td><td class="mono">0.0 pp</td></tr><tr><td>峰值显存</td><td>61.0 GiB</td><td>61.8 GiB</td><td class="mono">+1.3%</td></tr></tbody></table></div></section></div><aside class="stack">${versionCard()}<section class="card"><div class="card-head"><h2>发布前验收</h2></div><div class="card-body">${gates()}<div class="divider"></div><p class="version-help">${state.gatePassed?'目标 CUDA 的模拟门禁已通过。晋升仍需要显式操作；观察通过前 last_good 不变。':'缓存压力检查未完成，晋升入口被禁用。人工操作不能把缺失证据改成通过。'}</p></div></section><section class="card"><div class="card-head"><h2>继续验证</h2></div><div class="card-body"><p class="muted" style="font-size:11px;margin-bottom:13px">保留当前结果，新建 attempt 追加证据。</p><button class="btn" data-command="rerun" ${!commandAllowed('rerun')?'disabled':''}>${icon('refresh')}重跑实验</button></div></section></aside></div>`;}
function scopeMatches(scope,filter){return filter==='all'||scope===filter||scope.startsWith(filter+'.');}
function scopeButton(scope,label=scope){return `<button class="kb-scope ${kbScope===scope?'active':''}" data-scope="${esc(scope)}"><span>${esc(label)}</span><span class="count">${allKnowledge().filter(k=>scopeMatches(k.scope,scope)).length}</span></button>`;}
function knowledgeTree(){return `${scopeButton('all','全部知识')}<div class="kb-scope-label">SYSTEM / 总体约束</div>${baseScopes.map(scope=>{
 if(!['vllm','vllm-ascend'].includes(scope))return `${scope==='semantic-router'?'<div class="kb-scope-label">COMPONENTS / 分层知识</div>':''}${scopeButton(scope)}`;
 return `<details class="kb-branch" open><summary>${scope} / 7 个子层</summary><div class="kb-children">${scopeButton(scope,scope+' · 聚合')}${denseLayers.filter(l=>!l.key.startsWith('ops.')).map(l=>scopeButton(scope+'.'+l.key,l.key)).join('')}<details class="kb-branch" open><summary>ops / 算子子层</summary><div class="kb-children">${scopeButton(scope+'.ops','ops · 聚合')}${denseLayers.filter(l=>l.key.startsWith('ops.')).map(l=>scopeButton(scope+'.'+l.key,l.key.split('.')[1])).join('')}</div></details></div></details>`;
 }).join('')}<div class="kb-tree-note">父节点按 scope 前缀聚合。<br><strong>system 约束 → 当前层 → 相邻依赖 → 适用经验</strong><br><br>新增 14 条均是 synthetic 待验证检查清单。版本、硬件或负载变化后需复验。</div>`;}
function knowledgePage(){return pageHeader('分层知识库','保留 8 个原有范围；vllm 与 vllm-ascend 各扩展 7 个逻辑子层',`<button class="btn" data-command="knowledge">${icon('plus')}提交知识候选</button>`+exportBtn())+notice()+`<div class="kb-intro">${icon('knowledge',25)}<div><strong>知识是有适用范围的结论，证据是结论的依据。</strong>父节点聚合下级 scope；新增框架层级只保存待验证知识 / 检查清单，不声明真实性能结果。</div></div><div class="kb-layout"><aside class="card kb-tree">${knowledgeTree()}</aside><div><div class="kb-toolbar"><input id="kb-search" class="input search-field" type="search" value="${esc(kbQuery)}" placeholder="搜索结论、组件、证据或适用范围…" aria-label="搜索知识"><select id="kb-status" class="select" aria-label="知识验证状态"><option value="all">全部状态</option>${Object.entries(statusLabel).map(([v,t])=>`<option value="${v}" ${kbStatus===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="knowledge-results"></div></div></div>`;}
function renderKnowledgeResults(){const target=document.getElementById('knowledge-results');if(!target)return;const q=kbQuery.trim().toLowerCase();const filtered=allKnowledge().filter(k=>scopeMatches(k.scope,kbScope)&&(kbStatus==='all'||k.status===kbStatus)&&(!q||[k.id,k.title,k.body,k.scope,k.range,...k.evidence].join(' ').toLowerCase().includes(q)));target.innerHTML=`<div class="section-title"><span class="muted" style="font-size:10px">${filtered.length} 条结果 · 全部为演示条目</span><span class="eyebrow">SCOPED / VERSIONED / EVIDENCE-BACKED</span></div><div class="knowledge-grid">${filtered.map(k=>`<button class="knowledge-card" data-knowledge="${k.id}"><div class="k-meta"><span class="k-scope">${esc(k.scope)} / ${esc(k.id)}</span>${badge(statusLabel[k.status],k.status==='proposed'?'amber':k.status==='rejected'?'red':k.status==='deprecated'?'gray':'')}</div><h3>${esc(k.title)}</h3><div class="muted" style="font-size:10px">${esc(k.range)}</div><div class="k-footer"><span>${esc(k.type)} · 演示</span><span>${k.evidence.length?k.evidence.length+' 个证据引用':'缺少验证证据'} ↗</span></div></button>`).join('')}</div>${filtered.length?'':'<div class="card empty">没有匹配知识。可以切换组件、状态或清除搜索条件。</div>'}`;}

function denseCheckCard(layer){const backend=denseBackends.find(b=>b.key===denseBackend);return `<article class="card dense-check"><div class="dense-check-head"><div><h3>${esc(layer.key)}</h3><small>${esc(layer.label)} · ${esc(backend.label)}</small></div>${badge('unavailable · 未接通','gray')}</div><div class="dense-check-body"><div class="dense-check-cell"><strong>01 CHECK → 假设 / 补丁</strong><p><code>${esc(layer.check)}</code></p><p>${esc(layer.hypothesis)}</p><span class="muted">${esc(layer.patch)}</span></div><div class="dense-check-cell"><strong>02 冻结判据 → VALIDATOR</strong><p>${esc(layer.criterion)}</p><code>${esc(layer.validator)}</code></div><div class="dense-check-cell"><strong>03 证据 → 局部反馈</strong><p>evidence_refs = []<br>没有原始测试产物；探针尚未实现或接通。</p><span class="muted">计划观察：${esc(layer.signals)}</span></div></div><div class="dense-check-next"><span><b>next_test → </b>${esc(layer.next)}</span><button class="btn small" data-dense-check="${esc(layer.key)}">检查契约 ${icon('arrow',12)}</button></div></article>`;}
function densePage(){const backend=denseBackends.find(b=>b.key===denseBackend),layers=denseLayers.filter(l=>denseLayer==='all'||l.key===denseLayer);return pageHeader('稠密反馈','用可归因的局部检查缩短下一次实验；用独立证据决定是否接受候选',`<button class="btn" data-nav="knowledge">${icon('knowledge')}分层知识</button><button class="btn" data-action="api-snapshot">读取本地 API 快照</button>`)+`<div class="notice">${icon('shield')}<span><strong>SYNTHETIC / DEMO</strong> · 以下 14 个检查契约是规划示例；没有连接硬件、Profiler 或独立测试器。</span><span class="push">FINAL: INCONCLUSIVE</span></div><div class="dense-contract"><section class="card dense-lane"><div class="eyebrow">INNER LOOP / 便宜的局部检查</div><h2>每次补丁都有可定位的反馈</h2><div class="dense-chain"><span>假设 / 最小补丁</span>→<span>局部 validator</span>→<span>失败与证据</span>→<span>next_test ↻</span></div><p>优先运行受影响层的契约、参考数值、资源不变量或微基准；按正确性、系统行为、性能分类。结果可指导重试，但不触发晋升。</p></section><section class="card dense-lane external"><div class="eyebrow">OUTER GATE / 外部独立验收</div><h2>按冻结的 required_checks 裁决</h2><div class="dense-chain"><span>固定基线 / 留出任务</span>→<span>无 profile 配对测量</span>→<span>独立裁决</span></div><p>同 backend / engine version / model revision / workload 下，由测试器和冻结规则给出 PASS / FAIL / INCONCLUSIVE。Agent 自评与局部通过都不能代替最终验收。</p></section></div><div class="dense-rules"><div class="dense-rule"><strong>PROFILE = DIAGNOSTIC</strong>profile 帮助定位瓶颈；关闭 profiler 后重新测量，才能提供最终性能验收证据。</div><div class="dense-rule"><strong>MISSING = UNAVAILABLE</strong>没有探针、运行或原始证据时报告 unavailable；缺少 required check 时汇总 INCONCLUSIVE。</div><div class="dense-rule"><strong>SCOPE MUST MATCH</strong>CUDA 与 Ascend 各有基线；版本、模型或负载不一致时禁止混比。Synthetic 数据禁止晋升。</div></div><div class="dense-toolbar"><div class="dense-backends" role="group" aria-label="反馈后端">${denseBackends.map(b=>`<button class="btn ${denseBackend===b.key?'active':''}" data-dense-backend="${b.key}" aria-pressed="${denseBackend===b.key}">${b.label}</button>`).join('')}</div><label class="dense-filter" for="dense-layer">逻辑层 <select class="select" id="dense-layer"><option value="all">全部 7 层</option>${denseLayers.map(l=>`<option value="${l.key}" ${denseLayer===l.key?'selected':''}>${l.key}</option>`).join('')}</select></label></div><div class="dense-scope">backend=${esc(backend.key)} · candidate=demo-candidate · baseline=demo-baseline<br>engine_version=NOT_FROZEN · model_revision=NOT_FROZEN · workload_id=NOT_FROZEN · synthetic=true<br>显示 ${layers.length} / 7 层 · 实测证据 0 · 最终结果 INCONCLUSIVE</div><div class="dense-rows">${layers.map(denseCheckCard).join('')}</div>`;}
function showDenseCheck(key){const layer=denseLayers.find(l=>l.key===key);if(!layer)return;const backend=denseBackends.find(b=>b.key===denseBackend);detail(`${layer.key} · ${backend.label}`,'DENSE FEEDBACK / SYNTHETIC CONTRACT',`<div class="callout amber">此检查契约为 synthetic/demo。采集提示只说明未来接入方案；未实现或未运行的 probe = unavailable。</div><div class="detail-section"><div class="detail-kv"><span>check_id</span><span>${esc(layer.check)}</span></div><div class="detail-kv"><span>hypothesis_id</span><span>DEMO-H-${esc(layer.key)}</span></div><div class="detail-kv"><span>candidate / baseline</span><span>demo-candidate / demo-baseline</span></div><div class="detail-kv"><span>backend / verdict</span><span>${esc(backend.key)} / unavailable</span></div><div class="detail-kv"><span>profile / evidence</span><span>未采集 / []</span></div></div><div class="detail-section"><h3>假设与最小补丁</h3><p>${esc(layer.hypothesis)} ${esc(layer.patch)}</p></div><div class="detail-section"><h3>冻结判据与 validator</h3><p>${esc(layer.criterion)}</p><div class="step-output">${esc(layer.validator)}</div></div><div class="detail-section"><h3>后端采集提示 · 尚未接通</h3><p>${esc(layer[backend.key])}</p><p>信号：${esc(layer.signals)}。每个指标需保留单位、采样窗口和 scope。</p></div><div class="detail-section"><h3>证据要求</h3><p>保留命令、退出码、原始日志 URI / hash、测试器版本、候选与基线版本、模型 revision、工作负载、硬件和采集模式。引用存在不等于证据已核验。</p></div><div class="detail-section"><h3>next_test</h3><p>${esc(layer.next)}</p></div><button class="btn" data-kb-link="${esc(backend.scope+'.'+layer.key)}">查看待验证知识 ${icon('arrow')}</button><div class="callout" style="margin-top:18px">局部反馈供下一次修改使用。最终性能验收必须关闭 profiler，并由独立测试器按冻结规则完成。</div>`);}
async function readApiSnapshot(){
 const command='python -m agentinfer.rsi demo\npython -m agentinfer.rsi serve --port 8877';
 detail('本地 API 快照','READ ONLY / SEPARATE FROM SIMULATION',`<div class="callout">仅 GET /api/rsi/snapshot。读取结果不会替换浏览器演示状态，也不会连接真实 serving。</div><p style="margin-top:18px">正在读取本地快照…</p>`);
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),6000);
 try{
  if(!['http:','https:'].includes(location.protocol))throw new Error('当前以本地文件打开，没有同源 API 服务。');
  const response=await fetch('/api/rsi/snapshot',{method:'GET',headers:{Accept:'application/json'},cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error(`HTTP ${response.status}：本地快照 API 不可用。`);
  const snapshot=await response.json();
  if(!snapshot||typeof snapshot!=='object'||Array.isArray(snapshot))throw new Error('快照响应不是 JSON 对象。');
  // Never merge server JSON into the browser simulation or evaluate its content.
  if(document.getElementById('detail-eyebrow').textContent!=='READ ONLY / SEPARATE FROM SIMULATION'||!document.getElementById('detail-dialog').open)return;
  detail('本地 API 快照','READ ONLY / SEPARATE FROM SIMULATION',`<div class="callout">已读取本地文件 / 控制面快照，真实 serving 仍未连接。原始 JSON 仅供检查，不会更改模拟指标、候选状态或晋升按钮。</div><div class="detail-section"><div class="detail-kv"><span>来源</span><span>GET /api/rsi/snapshot</span></div><div class="detail-kv"><span>读取时间</span><span>${esc(new Date().toLocaleString('zh-CN'))}</span></div></div><pre class="api-json">${esc(JSON.stringify(snapshot,null,2))}</pre>`);
 }catch(error){
  if(document.getElementById('detail-eyebrow').textContent!=='READ ONLY / SEPARATE FROM SIMULATION'||!document.getElementById('detail-dialog').open)return;
  detail('本地 API 快照不可用','READ ONLY / SEPARATE FROM SIMULATION',`<div class="callout amber">${esc(error.name==='AbortError'?'读取超过 6 秒，本地 API 未及时响应。':error.message)}</div><div class="detail-section"><h3>启动本地 Dashboard 服务</h3><p>在仓库根目录、已安装本项目的 Python 环境中执行：</p><pre class="api-json">${esc(command)}</pre><p>然后打开命令输出的 HTTP 地址，再点击“读取本地 API 快照”。通过 file:// 或普通静态文件服务器打开时，此 API 通常不可用。</p></div><div class="callout">本地服务提供离线快照；启动它不等于接入 GPU / NPU 或真实 serving。浏览器模拟仍可独立使用。</div>`);
 }finally{clearTimeout(timer);}
}

function canPromote(){return state.stage===8&&state.gatePassed&&!state.paused&&!state.excluded&&!!state.accepted;}
function canRollback(){return state.active!==state.lastGood;}
function controlPage(){const cards=[['pause',state.paused?'恢复任务派发':'暂停任务派发',state.paused?'从当前状态继续；保留已完成实验与证据。':'停止派发新任务；真实系统需等待运行中任务收敛。',state.paused?'恢复派发':'暂停派发',state.excluded||state.stage>=9],['rerun','重跑 / 追加实验','创建新 attempt，保留历史证据；演示每次计 20,000 tokens，配额不足时禁用。','新建实验 attempt',!commandAllowed('rerun')],['hypothesis','追加研究假设','提交下一轮待办，不静默改写本轮已冻结的实验合同。','追加假设',false],['budget','调整运行预算','记录调整原因；新预算不能低于已消耗 Token 数。','调整预算',false],['promote','批准候选晋升',state.gatePassed?'目标门禁通过后切换 active，进入观察期。':'目标门禁未全部通过，人工操作也不能跳过验收。','审查并晋升',!canPromote()],['rollback','恢复稳定版本',canRollback()?`把 active 恢复为 ${state.lastGood}，归档本轮失败经验。`:'当前 active 与 last_good 一致，无待回滚候选。','回滚到 last_good',!canRollback()]];return pageHeader('人工干预','命令进入 Controller，状态变更保留原因、操作者与版本',exportBtn()+`<button class="btn" data-action="reset">${icon('refresh')}重置演示</button>`)+notice()+`<div class="control-grid">${cards.map(([type,title,desc,button,disabled])=>`<section class="card control-card"><div class="control-icon">${icon(type==='rerun'?'refresh':type==='hypothesis'?'plus':type==='budget'?'control':type==='promote'?'shield':type==='rollback'?'back':'pause',19)}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p><button class="btn ${type==='rollback'?'danger':''}" ${type==='pause'?'data-action="pause"':`data-command="${type}"`} ${disabled?'disabled':''}>${esc(button)} ${icon('arrow',12)}</button></section>`).join('')}</div><div class="grid-main"><div class="stack"><section class="card"><div class="card-head"><div><div class="eyebrow">AUDIT LOG</div><h2>每次干预都有记录</h2></div><span class="mono muted" style="font-size:10px">v${state.revision}</span></div><div class="table-wrap"><table><thead><tr><th>时间 / 命令</th><th>操作与原因</th><th>状态版本</th></tr></thead><tbody>${state.audit.map(a=>`<tr><td><span class="mono">${esc(a.time)}</span><small class="muted" style="display:block">${esc(a.id)}</small></td><td><span class="audit-type">${esc(a.type)}</span><small class="muted" style="display:block;white-space:normal;max-width:430px">${esc(a.reason)}</small></td><td class="mono">v${a.version}</td></tr>`).join('')}</tbody></table></div></section><section class="card"><div class="card-head"><h2>下一轮假设队列</h2>${badge(String(state.hypotheses.length)+' 条','gray')}</div><div class="card-body">${state.hypotheses.length?state.hypotheses.map(h=>`<div class="hypothesis">${esc(h.text)}<small>${esc(h.scope)} · ${esc(h.evidence||'待补充证据')} · ${esc(h.id)} · 待 Planner 审查</small></div>`).join(''):'<p class="muted" style="font-size:11px">暂无人工追加假设。可把观察到的问题提交给下一轮 Planner。</p>'}</div></section></div><aside class="stack">${versionCard()}<section class="card"><div class="card-head"><h2>排除当前候选</h2></div><div class="card-body"><p class="muted" style="font-size:11px;margin-bottom:14px">保留修改和实验记录，停止该候选后续推进。已激活候选需先回滚。</p><button class="btn danger" data-command="exclude" ${!commandAllowed('exclude')?'disabled':''}>${icon('stop')}排除 ${candidateId()}</button></div></section><section class="card"><div class="card-head"><h2>接入真实 Controller</h2></div><div class="card-body"><p class="muted" style="font-size:11px;line-height:1.9">读取：snapshot + event stream<br>写入：command API + expected_revision<br>校验：权限 / 幂等 / 门禁 / 资源状态<br>每条命令都要有原因与审计记录。</p></div></section></aside></div>`;}

 detail(id,'EVIDENCE ARTIFACT / DEMO',`<div class="callout amber" style="margin-bottom:20px">${record?'内置演示证据摘要，没有真实硬件运行或测试产物。':'此引用尚未校验，原型没有加载对应证据。不能据此确认结论。'}</div><div class="detail-section"><div class="detail-kv"><span>证据标识</span><span class="mono">${esc(id)}</span></div><div class="detail-kv"><span>证据类型</span><span>${esc(record?record[0]:'未知 / 待校验引用')}</span></div></div>${record?`<div class="detail-section"><h3>摘要</h3><p>${esc(record[1])}</p></div><div class="detail-section"><h3>证据边界</h3><p>${esc(record[2])}</p></div>`:''}<div class="detail-section"><h3>真实接入时应保存</h3><p>不可变产物 URI 与 hash、来源版本、运行 manifest、硬件与软件版本、原始日志、结果完整性和评分器版本；按证据类型分别展示。</p></div><div class="callout">证据保存原始事实，知识保存带范围的结论。不能因为存在一个 evidence_id 就宣称已验证。</div>`);
}
const descriptions={rerun:['重跑实验','保留旧 attempt，创建新实验；完成后重新裁决。'],hypothesis:['追加下一轮假设','建议进入待审队列，不改变本轮冻结合同。'],knowledge:['提交知识候选','人工输入先标为待验证，不直接升级为可信知识。'],budget:['调整 Token 预算','预算必须覆盖已消耗量；变更记录进入审计。'],promote:['批准候选晋升','仅对 CUDA 目标执行本页模拟切换，进入观察期。'],rollback:['回滚到稳定版本','恢复 last_good，保留候选证据与失败原因。'],exclude:['排除当前候选','停止该候选推进，稳定版本与已有证据保留。']};
function commandAllowed(type){if(type==='promote')return canPromote();if(type==='rollback')return canRollback();if(type==='rerun')return !state.excluded&&!state.paused&&state.stage<=8&&state.budget-state.used>=20000;if(type==='exclude')return !state.excluded&&state.stage<=8;return true;}
function openCommand(type){if(!descriptions[type])return;if(!commandAllowed(type)){toast('当前状态不满足执行条件；门禁或版本限制仍然有效。');return;}commandType={type,revision:state.revision};const [title,desc]=descriptions[type];document.getElementById('command-title').textContent=title;document.getElementById('command-desc').textContent=desc;let fields='';if(type==='budget')fields=`<div class="form-group"><label for="budget-input">Token 总预算</label><input class="input" id="budget-input" name="budget" type="number" min="${state.used}" max="100000000" step="1000" value="${state.budget}" required><div class="form-help">已使用 ${state.used.toLocaleString()} tokens。当前预算 ${state.budget.toLocaleString()}。</div></div>`;if(type==='hypothesis'||type==='knowledge')fields=`<div class="form-group"><label for="scope-input">组件 / 层级</label><select class="input" id="scope-input" name="scope">${scopes.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="form-group"><label for="claim-input">${type==='knowledge'?'知识结论候选':'研究假设'}</label><textarea class="input" id="claim-input" name="claim" placeholder="说明现象、假设和适用条件…" maxlength="600" required></textarea></div><div class="form-group"><label for="evidence-input">证据引用（可选，后续需校验）</label><input class="input" id="evidence-input" name="evidence" placeholder="例如 DEMO-E024-CUDA" maxlength="150"></div>`;if(type==='rerun')fields='<div class="callout" style="margin-bottom:17px">发布范围：CUDA。新建 attempt，不覆盖旧证据；每次重跑演示计 20,000 tokens。真实系统按观测用量结算。扩展至 Ascend 需新建实验合同。</div>';if(type==='promote')fields=`<div class="callout" style="margin-bottom:17px">${esc(state.active)} → ${esc(state.candidate)}<br>目标 CUDA 门禁已通过。last_good 保持 ${esc(state.lastGood)}，直到观察期通过。</div>`;if(type==='rollback')fields=`<div class="callout amber" style="margin-bottom:17px">active ${esc(state.active)} → last_good ${esc(state.lastGood)}<br>恢复成功后归档；真实恢复失败必须进入 NEEDS_RECOVERY。</div>`;fields+=`<div class="form-group"><label for="reason-input">操作原因</label><textarea class="input" id="reason-input" name="reason" placeholder="简要记录依据，供后续审计和复盘…" maxlength="500" required></textarea></div><div class="form-help">演示操作者：operator · expected_revision = ${state.revision}<br>本页不会请求生产 API；真实系统须在服务端校验权限与门禁。</div><div class="form-error" id="form-error" role="alert"></div>`;document.getElementById('command-fields').innerHTML=fields;document.getElementById('command-dialog').showModal();}
document.getElementById('command-form').addEventListener('submit',event=>{event.preventDefault();if(!commandType)return;const {type,revision}=commandType;const error=document.getElementById('form-error');if(revision!==state.revision){error.textContent='状态版本已变化，请关闭后重新打开操作。';return;}if(!commandAllowed(type)){error.textContent='执行条件已变化，此操作不能继续。';return;}const data=new FormData(event.currentTarget),reason=String(data.get('reason')||'').trim(),claim=String(data.get('claim')||'').trim(),scope=String(data.get('scope')||'system'),evidence=String(data.get('evidence')||'').trim();if(!reason||(['hypothesis','knowledge'].includes(type)&&!claim)){error.textContent='请填写非空的内容和操作原因。';return;}if(type==='budget'){const budget=Number(data.get('budget'));if(!Number.isFinite(budget)||budget<state.used||budget>100000000){error.textContent='预算必须不小于已消耗量，且在演示范围内。';return;}state.budget=budget;audit('BUDGET_UPDATED',reason+' · '+budget+' tokens');}else if(type==='rerun'){state.attempt++;state.used+=20000;state.stage=5;state.gatePassed=false;state.accepted=null;state.phaseNote='追加实验已登记 · attempt '+state.attempt;audit('TRIAL_REQUESTED',reason+' · attempt '+state.attempt);}else if(type==='hypothesis'){state.hypotheses.push({id:'H-'+String(state.revision+1).padStart(4,'0'),text:claim,scope,evidence});audit('HYPOTHESIS_PROPOSED',reason);}else if(type==='knowledge'){const id='K-U'+String(state.revision+1).padStart(4,'0');state.extraKnowledge.push({id,scope,type:'人工知识候选',status:'proposed',title:claim,body:reason,range:'人工提供 · 适用版本尚待核验',evidence:evidence?[evidence]:[],invalid:'取得独立证据并核验适用范围后，再决定验证或否定。',related:['system'],confidence:'未验证；引用存在不代表证据已核验',use:'下一轮 Planner 审查'});audit('KNOWLEDGE_PROPOSED',id+' · '+reason);}else if(type==='promote'){state.active=state.candidate;state.stage=9;state.phaseNote='候选已模拟激活，正在观察；last_good 尚未更新';audit('PROMOTION_ACTIVATED',reason+' · '+state.active);}else if(type==='rollback'){const failed=state.active;state.active=state.lastGood;state.stage=10;state.phaseNote='已回滚';state.excluded=true;audit('ROLLBACK_CONFIRMED',reason+' · '+failed+' → '+state.lastGood);}else if(type==='exclude'){state.excluded=true;state.accepted=null;state.phaseNote='候选已排除';audit('CANDIDATE_EXCLUDED',reason);}document.getElementById('command-dialog').close();commandType=null;render();toast('已更新本地演示状态，并写入审计记录。');});
function advance(){if(state.paused||state.excluded){toast('运行已暂停或候选被排除，无法推进。');return;}if(state.stage===8){openCommand('promote');return;}if(state.stage===7){state.gatePassed=true;state.accepted=state.candidate;state.stage=8;state.phaseNote='CUDA 门禁通过，等待人工晋升';audit('EVALUATION_PASSED','模拟完成缓存压力检查；accepted='+state.accepted+'，active 未改变');}else if(state.stage===9){state.lastGood=state.active;state.stage=10;state.phaseNote='观察通过，稳定基线已更新';state.extraKnowledge.push({id:'K-R'+state.round,scope:'system',type:'轮次经验候选',status:'proposed',title:roundId()+' 观察期通过，待归纳适用条件',body:'本页模拟观察通过。真实实现需关联 SoakResult、任务与性能证据，由知识审查决定是否晋升结论。',range:'CUDA · '+state.candidate,evidence:['DEMO-SOAK-'+state.round],invalid:'版本、负载或硬件改变后重新验证。',related:['router','agent-cache'],confidence:'演示观察结果；知识结论待审查',use:'下一轮规划'});audit('SOAK_PASSED','模拟观察通过；last_good='+state.lastGood+'；经验候选已归档');}else if(state.stage===10){showNextRound();return;}else{state.stage++;if(state.stage===6)state.completedAttempt=state.attempt;state.phaseNote=state.stage===6?'追加实验结束，正在汇总证据':state.stage===7?'等待缓存压力检查完成':'模拟任务推进至 '+steps[state.stage-1].name;audit('DEMO_STEP_ADVANCED','进入步骤 '+state.stage+' · '+steps[state.stage-1].name);}render();}
function showNextRound(){detail('⑩ → ① · 下一轮准备','KNOWLEDGE FEEDBACK / NEXT ROUND',`<div class="detail-section"><h3>新的基线</h3><div class="step-output">baseline = ${esc(state.lastGood)}</div></div><div class="detail-section"><h3>新的知识快照</h3><p>保留 system 契约，按新的组件版本与目标硬件重新检索。上一轮经验先形成候选；未经验证的解释不直接成为可信知识。</p></div><div class="detail-section"><h3>新的实验合同</h3><p>创建新 round_id，重新冻结预算、假设和验收规则，并消费人工假设队列。前一轮证据继续保留。</p></div><div class="callout" style="margin-bottom:20px">本原型只含 R-024 的内置数据，此处展示下一轮逻辑，不伪造新一轮测量。</div><button class="btn" data-action="reset">回到初始快照再体验</button>`);}
function openReset(){detail('重新体验完整闭环','RESET LOCAL DEMO',`<div class="detail-section"><p>重置本页保存的演示状态、人工输入和审计记录，回到 R-024 的⑦独立裁决。可以先导出快照保留当前演示结果。</p></div><div class="callout" style="margin-bottom:20px">真实系统的⑩→①会创建新 round_id，冻结最新 last_good 并检索新上下文。本原型保留同一组内置实验数据。</div><div style="display:flex;gap:8px"><button class="btn" data-action="export">${icon('download')}先导出快照</button><button class="btn primary" data-action="confirm-reset">重置本地演示</button></div>`);}
function exportSnapshot(){const body={kind:'RSI_DASHBOARD_DEMO',warning:'所有数据和操作均为本地演示，非实际测量或部署',exported_at:new Date().toISOString(),state,knowledge:allKnowledge(),changes,metrics:{backend:'CUDA',experiment_attempt:state.completedAttempt,current_attempt:state.attempt,awaiting_new_evidence:state.attempt!==state.completedAttempt,paired_repetitions:3,samples:3,throughput:{baseline:1200,candidate:1440},p95_ttft:{baseline:480,candidate:384},task_pass:{baseline:[48,50],candidate:[48,50]},peak_memory_gib:{baseline:61,candidate:61.8}},production_connected:false};const json=JSON.stringify(body,null,2);detail('导出演示快照','SNAPSHOT / JSON',`<div class="callout" style="margin-bottom:17px">当前状态、知识、示意补丁和指标会一起导出，包含演示标记与证据 attempt。下载不可用时可复制 JSON。</div><label for="snapshot-json" class="mini-label">快照内容 · 可选择复制</label><textarea id="snapshot-json" class="input mono" readonly style="height:340px;font-size:10px;line-height:1.7">${esc(json)}</textarea><div style="display:flex;gap:8px;margin-top:15px"><button class="btn primary" data-action="download-snapshot">${icon('download')}下载 JSON</button><button class="btn" data-action="copy-snapshot">复制 JSON</button></div>`);}
function downloadSnapshot(){const text=document.getElementById('snapshot-json')?.value;if(!text)return;const url=URL.createObjectURL(new Blob([text],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=`rsi-demo-${roundId()}-v${state.revision}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('下载请求已提交；若浏览器未保存，可复制 JSON。');}
async function copySnapshot(){const field=document.getElementById('snapshot-json');if(!field)return;try{await navigator.clipboard.writeText(field.value);toast('演示快照 JSON 已复制。');}catch{field.focus();field.select();toast('内容已选中，请按 Ctrl+C 或 Command+C 复制。');}}

document.addEventListener('click',event=>{const el=event.target.closest('button,[data-change]');if(!el||el.disabled)return;if(el.dataset.nav){navigate(el.dataset.nav);return;}if(el.dataset.denseBackend){denseBackend=el.dataset.denseBackend;render();return;}if(el.dataset.denseCheck){showDenseCheck(el.dataset.denseCheck);return;}if(el.dataset.step){showStep(Number(el.dataset.step));return;}if(el.dataset.change){showChange(el.dataset.change);return;}if(el.dataset.knowledge){showKnowledge(el.dataset.knowledge);return;}if(el.dataset.evidence){showEvidence(el.dataset.evidence);return;}if(el.dataset.scope){kbScope=el.dataset.scope;render();return;}if(el.dataset.kbLink){document.getElementById('detail-dialog').close();kbScope=el.dataset.kbLink;kbQuery='';kbStatus='all';navigate('knowledge');return;}if(el.dataset.command){openCommand(el.dataset.command);return;}const action=el.dataset.action;if(action==='api-snapshot'){readApiSnapshot();}else if(action==='close-command'){document.getElementById('command-dialog').close();commandType=null;}else if(action==='close-detail')document.getElementById('detail-dialog').close();else if(action==='pause'){if(state.excluded||state.stage>=9)return;state.paused=!state.paused;audit(state.paused?'DISPATCH_PAUSED':'DISPATCH_RESUMED','操作者'+(state.paused?'暂停':'恢复')+'新任务派发 · 演示');render();toast(state.paused?'演示已暂停，已有证据保持不变。':'演示已恢复。');}else if(action==='advance')advance();else if(action==='search-kb'){navigate('knowledge');document.getElementById('kb-search').focus();}else if(action==='export')exportSnapshot();else if(action==='download-snapshot')downloadSnapshot();else if(action==='copy-snapshot')copySnapshot();else if(action==='reset')openReset();else if(action==='confirm-reset'){document.getElementById('detail-dialog').close();state=freshState();save();render();toast('已回到初始演示快照。');}});
document.addEventListener('input',event=>{if(event.target.id==='kb-search'){kbQuery=event.target.value;renderKnowledgeResults();}});
document.addEventListener('change',event=>{if(event.target.id==='dense-layer'){denseLayer=event.target.value;render();}else if(event.target.id==='kb-status'){kbStatus=event.target.value;renderKnowledgeResults();}else if(event.target.id==='chart-metric'){chartMetric=event.target.value;render();}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(document.querySelector('dialog[open]'))return;navigate('knowledge');document.getElementById('kb-search').focus();}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-change]')){event.preventDefault();showChange(event.target.dataset.change);}});
document.getElementById('command-dialog').addEventListener('close',()=>commandType=null);
render();
</script>
</body>
