# Copy to the engine's recipes/<recipe-id>.yaml and replace every placeholder.
# Canonical contract: https://github.com/InferMatrixLab/recipe/blob/main/schemas/recipe.schema.json
# Template only: not publishable catalog content. See README.md for status rules.
schema_version: 1
id: "<recipe-id>"
title: "<display-title>"
kind: standalone_engine
model:
  id: "<provider/model-id>"
  provider: "<provider>"
  task: "<task_snake_case>"
engine:
  id: "<engine-id>"
  name: "<engine-name>"
  repository: "https://github.com/InferMatrixLab/<engine-repo>"
  ref: "<release-tag-or-deployment-commit>"
runtime:
  backend: "<backend>"
  precision: "<precision>"
hardware:
  vendor: "<vendor>"
  model: "<exact-device-model>"
  device_count: 1
environment:
  os: "<tested-os>"
  requirements:
    - "<required-runtime-and-version>"
commands:
  install: "<reviewed-install-command>"
  serve: "<reviewed-start-command>"
  request: "<minimal-request-command>"
  benchmark: null
deployment:
  status: unverified
  last_verified_at: null
  evidence_url: null
acceptance:
  verdict: INCONCLUSIVE
  issue_url: null
  evidence_url: null
maintainers:
  - "<github-login>"
updated_at: "<YYYY-MM-DD>"
limitations: []
