# CI service: tag the image by commit; bind-mount the Buildkite checkout onto itself
# and set workdir there so bare pytest runs against PR code, and artifacts such as
# junit land in the checkout for artifact_paths to collect.
services:
  agentinfer-ci:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agentinfer-ci:${BUILDKITE_COMMIT:-local}
    # Base image ENTRYPOINT is `vllm serve`; clear it or commands become vllm args.
    entrypoint: [""]
    # Match the Buildkite agent UID/GID so checkout files are not left as root
    # (which breaks the next checkout cleanup). Interpolated from the agent job
    # environment (step env / agent env), not from in-container environment.
    user: "${BUILDKITE_AGENT_UID:-999}:${BUILDKITE_AGENT_GID:-999}"
    working_dir: ${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}
    network_mode: host
    ipc: host
    privileged: true
    shm_size: 64gb
    cap_add: [SYS_PTRACE]
    security_opt: [seccomp:unconfined]
    volumes:
      - /home:/home
      - ${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}:${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}
    environment:
      HF_ENDPOINT: https://hf-mirror.com
      HF_HOME: /home/models
      HF_HUB_CACHE: /home/models/hub
      HOME: /tmp
      USER: buildkite-agent
      LOGNAME: buildkite-agent
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
