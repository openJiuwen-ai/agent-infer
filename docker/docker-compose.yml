# CI service. GPU and CPU builds run in parallel and must not share a tag:
# each one deletes its own tag before building. Bind-mount the checkout onto
# itself for pytest, and also onto /app. The image editable-installs
# agentinfer there, and the vllm console script loads that path rather than
# the pytest working directory.
x-nvidia-driver-bind: &nvidia-driver-bind
  type: bind
  read_only: true
  bind:
    create_host_path: false

x-ci-base: &ci-base
  build: &ci-build
    context: ..
    dockerfile: docker/Dockerfile
    target: ci
  # Runs as root, then ci-entrypoint.sh switches to the UID that owns the
  # checkout (the working directory). Do not set `user:` here.
  entrypoint: ["/usr/local/bin/ci-entrypoint.sh"]
  working_dir: ${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}
  network_mode: host
  ipc: host
  shm_size: 64gb
  cap_add: [SYS_PTRACE]
  volumes:
    - &models-bind /home/models:/home/models
    - &checkout-bind ${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}:${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}
    - &app-bind ${BUILDKITE_BUILD_CHECKOUT_PATH:-/app}:/app
  environment: &ci-environment
    HF_ENDPOINT: https://hf-mirror.com
    HF_HOME: /home/models
    HF_HUB_CACHE: /home/models/hub
    HOME: /tmp/ci-home
    # Empty unless the step sets it. ci-entrypoint.sh stays root only then.
    AGENTINFER_CI_AS_ROOT: ${AGENTINFER_CI_AS_ROOT:-}
    # Root workers and sudo-wrapped benchmarks share the checkout. Avoid
    # root-owned __pycache__ directories that block the next host checkout.
    PYTHONDONTWRITEBYTECODE: "1"
    PYTEST_ADDOPTS: -o cache_dir=/tmp/pytest-cache

services:
  agentinfer-ci:
    <<: *ci-base
    image: agentinfer-ci:${BUILDKITE_BUILD_ID:-local}-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Share the build and checkout settings without inheriting GPU reservations.
  agentinfer-cpu:
    <<: *ci-base
    image: agentinfer-ci:${BUILDKITE_BUILD_ID:-local}-cpu

  # Accuracy runs pytest as root; plan-subagent benchmarks use the requested user.
  # Accuracy services expose Docker and permit the agent bubblewrap sandboxes.
  agentinfer-accuracy: &accuracy-base
    <<: *ci-base
    build:
      <<: *ci-build
      target: accuracy
    image: agentinfer-ci:${BUILDKITE_BUILD_ID:-local}-nightly-gpu
    profiles: [accuracy]
    # Avoid NVIDIA runtime /proc submounts inside the nested agent sandbox.
    runtime: runc
    cap_drop: [MKNOD]
    devices:
      - /dev/nvidia0:/dev/nvidia0:rw
      - /dev/nvidia1:/dev/nvidia1:rw
      - /dev/nvidiactl:/dev/nvidiactl:rw
      - /dev/nvidia-uvm:/dev/nvidia-uvm:rw
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools:rw
    environment:
      <<: *ci-environment
      AGENTINFER_CI_AS_ROOT: "1"
      CUDA_VISIBLE_DEVICES:
      NVIDIA_VISIBLE_DEVICES: void
      AGENTINFER_CI_NVIDIA_DRIVER_DIR: /opt/agentbench-nvidia-driver
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - label=disable
      # Bubblewrap needs an unmasked /proc to create its nested PID namespace.
      - systempaths=unconfined
    volumes:
      - *models-bind
      - *checkout-bind
      - *app-bind
      - /var/run/docker.sock:/var/run/docker.sock
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1
        target: /opt/agentbench-nvidia-driver/libcuda.so
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libcuda.so.1
        target: /opt/agentbench-nvidia-driver/libcuda.so.1
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ml.so.1
        target: /opt/agentbench-nvidia-driver/libnvidia-ml.so.1
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-ptxjitcompiler.so.1
        target: /opt/agentbench-nvidia-driver/libnvidia-ptxjitcompiler.so.1
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-nvvm.so.4
        target: /opt/agentbench-nvidia-driver/libnvidia-nvvm.so.4
      - <<: *nvidia-driver-bind
        source: ${AGENTINFER_CI_NVIDIA_LIB_DIR:-/usr/lib/x86_64-linux-gnu}/libnvidia-nvvm70.so.4
        target: /opt/agentbench-nvidia-driver/libnvidia-nvvm70.so.4
      - <<: *nvidia-driver-bind
        source: /usr/bin/nvidia-smi
        target: /usr/bin/nvidia-smi

  # Ready exercises only Jiuwen; reuse its scoring/SDK layers in nightly.
  agentinfer-accuracy-jiuwen:
    <<: *accuracy-base
    build:
      <<: *ci-build
      target: accuracy-jiuwen
    image: agentinfer-ci:${BUILDKITE_BUILD_ID:-local}-ready-accuracy-gpu
