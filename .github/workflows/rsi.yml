name: RSI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/rsi/**'
      - '.github/workflows/rsi.yml'
  push:
    branches: [main]
    paths:
      - 'tools/rsi/**'
      - '.github/workflows/rsi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: tools/rsi

jobs:
  cpu-tests:
    name: RSI CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install standalone RSI dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check CLI installation
        run: ve --help
      - name: Run CPU tests
        run: python -m pytest -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff==0.14.0
      - name: Check maintained RSI Python code
        run: ruff check src tests integrations/frontier
