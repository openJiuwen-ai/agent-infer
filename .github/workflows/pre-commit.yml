name: pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Add markdownlint matcher
        run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual
        env:
          # The full tree still has historical findings for these hooks.
          SKIP: mypy,shellcheck,check-buildkite,check-spdx-header

      - name: Check files added in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          added_list=$(mktemp)
          trap 'rm -f "$added_list"' EXIT
          if ! git diff -z --name-only --diff-filter=A "$BASE_SHA...$HEAD_SHA" >"$added_list"; then
            echo "::error::git diff against $BASE_SHA failed; cannot determine added files"
            exit 1
          fi
          added=()
          if [ -s "$added_list" ]; then
            mapfile -d '' added <"$added_list"
          fi
          if [ "${#added[@]}" -eq 0 ]; then
            echo "No added files in this pull request."
            exit 0
          fi
          printf 'Checking added files:\n'
          printf '  %s\n' "${added[@]}"
          pre-commit run mypy --hook-stage manual --files "${added[@]}"
          pre-commit run shellcheck --hook-stage manual --files "${added[@]}"
          pre-commit run check-buildkite --hook-stage manual --files "${added[@]}"
          pre-commit run check-spdx-header --hook-stage manual --files "${added[@]}"
