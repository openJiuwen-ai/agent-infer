name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Add markdownlint matcher
        run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      MPLBACKEND: Agg
      MPLCONFIGDIR: /tmp/matplotlib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: CPU unit tests (no vLLM)
        run: |
          pytest --timeout=120 -v --durations=20 \
            tests/agentbench \
            tests/scheduling \
            tests/tools \
            tests/agentcache/test_entrypoints.py

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          commits=$(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD)
          for commit in $commits; do
            if ! git log -1 --format="%B" $commit | grep -q "^Signed-off-by:"; then
              echo "::error::Commit $commit is missing Signed-off-by"
              exit 1
            fi
          done
