name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Add markdownlint matcher
        run: echo "::add-matcher::.github/workflows/matchers/markdownlint.json"

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual

  dco:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        run: |
          commits=$(git rev-list --no-merges origin/${{ github.base_ref }}..HEAD)
          for commit in $commits; do
            if ! git log -1 --format="%B" $commit | grep -q "^Signed-off-by:"; then
              echo "::error::Commit $commit is missing Signed-off-by"
              exit 1
            fi
          done
