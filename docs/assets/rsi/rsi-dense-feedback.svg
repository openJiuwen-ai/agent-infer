<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>稠密反馈与知识回路</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#347151"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203128"><rect width="1600" height="900" fill="#F3F4EE"/><text x="64" y="90" font-size="44" font-weight="700">稠密反馈与知识回路</text><path d="M364,277.5 H398 V277.5 H432" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1067,277.5 H1101 V277.5 H1135" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1335.5,340 V387.5 H1335.5 V435" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1135,492.5 H1101 V492.5 H1067" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M610,492.5 H576 V492.5 H542" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M303,550 V611.5 H303 V673" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M542,725.5 H576 V725.5 H610" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1335.5,435 V387.5 H749.5 V340" fill="none" stroke="#347151" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M64,725.5 H40 V277.5 H64" fill="none" stroke="#347151" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><g id="hypothesis"><rect x="64" y="215" width="300" height="125" fill="#D8EC95" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="249" font-size="25" font-weight="700" fill="#203128">③ 可证伪假设</text><text x="80" y="291" font-size="21" font-weight="400" fill="#68776A">机制预测 / 否定条件</text></g><g id="probe"><rect x="432" y="215" width="635" height="125" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="448" y="249" font-size="25" font-weight="700" fill="#203128">④⑤ 局部探针与观测</text><text x="448" y="291" font-size="21" font-weight="400" fill="#68776A">参考 / 差分 / 受控干预 / 消融 + profile</text></g><g id="record"><rect x="1135" y="215" width="401" height="125" fill="#E8F0E2" stroke="#CDD8C8" stroke-width="1.5"/><text x="1151" y="249" font-size="25" font-weight="700" fill="#203128">⑥ FeedbackRecord</text><text x="1151" y="291" font-size="21" font-weight="400" fill="#68776A">结果 / oracle / scope / evidence</text></g><g id="fix"><rect x="1135" y="435" width="401" height="115" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="1151" y="469" font-size="25" font-weight="700" fill="#203128">④ 局部修正</text><text x="1151" y="511" font-size="21" font-weight="400" fill="#68776A">依据客观差异缩小搜索范围</text></g><g id="integrate"><rect x="610" y="435" width="457" height="115" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="626" y="469" font-size="25" font-weight="700" fill="#203128">⑤ 集成与真实任务 E2E</text><text x="626" y="511" font-size="21" font-weight="400" fill="#68776A">固定环境下验收质量与性能</text></g><g id="gate"><rect x="64" y="435" width="478" height="115" fill="#FAF0DF" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="469" font-size="25" font-weight="700" fill="#203128">⑦ 独立裁决</text><text x="80" y="511" font-size="21" font-weight="400" fill="#68776A">通过后进入⑧激活与⑨观察</text></g><g id="knowledge"><rect x="64" y="673" width="478" height="105" fill="#E8F0E2" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="707" font-size="25" font-weight="700" fill="#203128">⑩ 知识晋升 / 反例保留</text><text x="80" y="749" font-size="21" font-weight="400" fill="#68776A">证据齐全 + scope + 失效条件</text></g><g id="retrieve"><rect x="610" y="673" width="926" height="105" fill="#D8EC95" stroke="#CDD8C8" stroke-width="1.5"/><text x="626" y="707" font-size="25" font-weight="700" fill="#203128">下一轮①基线与③规划</text><text x="626" y="749" font-size="21" font-weight="400" fill="#68776A">检索 system 契约、当前层知识与相邻依赖；记录引用版本</text></g><text x="327" y="584" font-size="20" fill="#68776A" font-weight="400">经⑧激活 / ⑨观察</text><text x="327" y="610" font-size="20" fill="#68776A" font-weight="400">异常先恢复</text><text x="610" y="592" font-size="22" fill="#68776A" font-weight="400">局部反馈低成本、及时、客观可验证，检查顺序由假设决定。</text><text x="610" y="620.6" font-size="22" fill="#68776A" font-weight="400">profile 运行不能作为最终性能验收。</text></g></svg>