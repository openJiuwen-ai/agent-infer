<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><title>整体分层架构</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#347151"/></marker></defs><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#203128"><rect width="1600" height="900" fill="#F3F4EE"/><text x="64" y="90" font-size="44" font-weight="700">整体分层架构</text><path d="M569,280 V304 H569 V328" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M569,448 V472 H569 V496" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M569,616 V640 H306.5 V664" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M569,616 V640 H831.5 V664" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1336.5,332 V365 H1336.5 V398" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1336.5,536 V569 H1336.5 V602" fill="none" stroke="#347151" stroke-width="2.3"  marker-end="url(#arrow)"/><path d="M1137,267 H1105.5 V388 H1074" fill="none" stroke="#347151" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M1074,556 H1105.5 V671 H1137" fill="none" stroke="#347151" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><path d="M1536,671 L1560,671 L1560,188 L40,188 L40,388 L64,388" fill="none" stroke="#347151" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow)"/><g id="applications"><rect x="64" y="202" width="1010" height="78" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="236" font-size="26" font-weight="700" fill="#203128">应用与 Agent 入口</text><text x="80" y="264" font-size="21" font-weight="400" fill="#68776A">Coding / 办公 / Science，ZCode 或 openJiuwen runtime</text></g><g id="harness"><rect x="64" y="328" width="1010" height="120" fill="#E8F0E2" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="362" font-size="25" font-weight="700" fill="#203128">Harness 与多 Agent 协作</text><text x="80" y="404" font-size="21" font-weight="400" fill="#68776A">Planner / Profiler / Implementer / Reviewer</text><text x="80" y="431" font-size="21" font-weight="400" fill="#68776A">任务 DAG、会话、上下文、工具权限、结构化产物</text></g><g id="inference"><rect x="64" y="496" width="1010" height="120" fill="#DCEAF0" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="530" font-size="25" font-weight="700" fill="#203128">AgentInfer 推理服务层</text><text x="80" y="572" font-size="21" font-weight="400" fill="#68776A">Semantic Router、Router、工作流观测与准入策略</text><text x="80" y="599" font-size="21" font-weight="400" fill="#68776A">AgentCache 提供工作流感知，vLLM 保有原生调度与物理 KV</text></g><g id="cuda"><rect x="64" y="664" width="485" height="103" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="80" y="698" font-size="25" font-weight="700" fill="#203128">vLLM / CUDA backend</text><text x="80" y="740" font-size="21" font-weight="400" fill="#68776A">固定 GLM-5.3-Flash，环境未验证</text></g><g id="ascend"><rect x="589" y="664" width="485" height="103" fill="#FFFEFA" stroke="#CDD8C8" stroke-width="1.5"/><text x="605" y="698" font-size="25" font-weight="700" fill="#203128">vLLM-Ascend backend</text><text x="605" y="740" font-size="21" font-weight="400" fill="#68776A">独立兼容与性能证据，环境未验证</text></g><g id="controller"><rect x="1137" y="202" width="399" height="130" fill="#D8EC95" stroke="#CDD8C8" stroke-width="1.5"/><text x="1153" y="236" font-size="25" font-weight="700" fill="#203128">RSI Controller</text><text x="1153" y="278" font-size="21" font-weight="400" fill="#68776A">唯一状态迁移入口</text><text x="1153" y="305" font-size="21" font-weight="400" fill="#68776A">预算、租约、版本指针与恢复</text></g><g id="lab"><rect x="1137" y="398" width="399" height="138" fill="#FAF0DF" stroke="#CDD8C8" stroke-width="1.5"/><text x="1153" y="432" font-size="25" font-weight="700" fill="#203128">隔离实验与独立裁决</text><text x="1153" y="474" font-size="21" font-weight="400" fill="#68776A">AgentBench / 局部探针 / E2E</text><text x="1153" y="501" font-size="21" font-weight="400" fill="#68776A">候选设备与稳定服务隔离</text></g><g id="knowledge"><rect x="1137" y="602" width="399" height="138" fill="#E8F0E2" stroke="#CDD8C8" stroke-width="1.5"/><text x="1153" y="636" font-size="25" font-weight="700" fill="#203128">证据与分层知识库</text><text x="1153" y="678" font-size="21" font-weight="400" fill="#68776A">原始证据、scope、失效条件</text><text x="1153" y="705" font-size="21" font-weight="400" fill="#68776A">已验证知识进入下一轮</text></g><text x="65" y="807" font-size="23" fill="#68776A" font-weight="400">在线路径与 RSI 旁路分离。知识按 scope 注入下一轮 Harness，模型权重保持固定。</text></g></svg>